repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: '\.(sh|bash|sh\.tmpl)$'
        args: ["-x"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-bn"]
        files: '\.(sh|bash)$'

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua-system
        files: '\.lua$'

  - repo: local
    hooks:
      - id: chezmoi-verify
        name: chezmoi verify (templates resolve)
        language: system
        entry: bash -c 'command -v chezmoi >/dev/null && chezmoi verify --source=. || true'
        pass_filenames: false
        always_run: true
