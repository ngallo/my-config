# ~/.config/starship.toml — fast, native prompt. See https://starship.rs

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold cyan"
read_only         = " "

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style      = "bold yellow"
modified   = "●${count} "
staged     = "+${count} "
ahead      = "↑${count} "
behind     = "↓${count} "
diverged   = "↕↑${ahead_count}↓${behind_count} "
conflicted = "= "
untracked  = ""
renamed    = ""
deleted    = ""
stashed    = ""

[cmd_duration]
min_time = 2000
format   = "took [$duration](bold yellow) "

[hostname]
ssh_only      = true
format        = "[$hostname](bold red)"
disabled      = false

[kubernetes]
disabled = true

[docker_context]
disabled = true

[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[java]
disabled = true
