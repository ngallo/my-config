# ~/.config/starship.toml — fast, native prompt. See https://starship.rs

add_newline = true
command_timeout = 1000

format = """
$os\
$username\
[@](dimmed) \
$hostname\
[ in ](dimmed)\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$java\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold cyan"
read_only         = " "

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style          = "bold yellow"
ahead          = "⇡${count}"
behind         = "⇣${count}"
diverged       = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted     = "="
untracked      = "?${count}"
stashed        = "\\$${count}"
modified       = "!${count}"
staged         = "+${count}"
renamed        = "»${count}"
deleted        = "✘${count}"

[cmd_duration]
min_time = 2000
format   = "took [$duration](bold yellow) "

[hostname]
ssh_only      = true
format        = "[$hostname](bold red)"
disabled      = false

[kubernetes]
disabled = false
format   = "on [⛵ $context](dimmed green) "

[docker_context]
format = "via [🐳 $context](blue bold) "

[nodejs]
format = "via [⬢ $version](bold green) "
[python]
format = "via [🐍 $version](bold green) "
[rust]
format = "via [🦀 $version](bold red) "
[golang]
format = "via [🐹 $version](bold cyan) "
[java]
format = "via [☕ $version](red dimmed) "
