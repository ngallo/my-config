# theme.toml — Tokyo Night palette for yazi. Matches the fzf colors in
# core/dot_zshrc.tmpl so pickers and file manager share the same look.

[mgr]
cwd = { fg = "#7dcfff" }

hovered         = { fg = "#1a1b26", bg = "#7aa2f7" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#e0af68", italic = true }
find_position = { fg = "#bb9af7", bg = "reset", italic = true }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7aa2f7", bg = "#7aa2f7" }
marker_selected = { fg = "#bb9af7", bg = "#bb9af7" }

tab_active   = { fg = "#1a1b26", bg = "#7aa2f7" }
tab_inactive = { fg = "#c0caf5", bg = "#3b4261" }
tab_width    = 1

count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#bb9af7" }

border_symbol = "│"
border_style  = { fg = "#3b4261" }

syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3b4261", bg = "#3b4261" }

mode_normal = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
mode_select = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
mode_unset  = { fg = "#1a1b26", bg = "#f7768e", bold = true }

progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#3b4261" }
progress_error  = { fg = "#f7768e", bg = "#3b4261" }

permissions_t = { fg = "#7dcfff" }
permissions_r = { fg = "#e0af68" }
permissions_w = { fg = "#f7768e" }
permissions_x = { fg = "#9ece6a" }
permissions_s = { fg = "#bb9af7" }

[status.perm_sep]
fg = "#565f89"

[input]
border   = { fg = "#7aa2f7" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#7aa2f7" }
active   = { fg = "#bb9af7" }
inactive = {}

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#1a1b26" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#565f89" }
desc            = { fg = "#bb9af7" }
separator       = "  "
separator_style = { fg = "#3b4261" }

[help]
on      = { fg = "#bb9af7" }
exec    = { fg = "#7dcfff" }
desc    = { fg = "#565f89" }
hovered = { bg = "#3b4261", bold = true }
footer  = { fg = "#3b4261", bg = "#c0caf5" }

[filetype]
rules = [
  { mime = "image/*", fg = "#bb9af7" },
  { mime = "video/*", fg = "#e0af68" },
  { mime = "audio/*", fg = "#e0af68" },
  { mime = "application/zip",             fg = "#f7768e" },
  { mime = "application/gzip",            fg = "#f7768e" },
  { mime = "application/x-tar",           fg = "#f7768e" },
  { mime = "application/x-bzip",          fg = "#f7768e" },
  { mime = "application/x-bzip2",         fg = "#f7768e" },
  { mime = "application/x-7z-compressed", fg = "#f7768e" },
  { mime = "application/x-rar",           fg = "#f7768e" },
  { mime = "application/xz",              fg = "#f7768e" },
  { url = "*",  fg = "#c0caf5" },
  { url = "*/", fg = "#7aa2f7" },
]

[icon]
# yazi-rs ships sensible defaults; override only if you want custom icons.
