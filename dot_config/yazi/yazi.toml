# yazi — TUI file manager. Schema for yazi 25.x ([mgr] block).
# Docs: https://yazi-rs.github.io/docs/configuration/yazi/

[mgr]
ratio          = [1, 3, 4]   # parent · current · preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1200
image_filter    = "triangle"
image_quality   = 80
image_delay     = 30
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Edit", block = true, for = "unix" },
]
open = [
  { run = 'open "$@"',      desc = "Open",  for = "macos" },
  { run = 'xdg-open "$@"',  desc = "Open",  for = "linux" },
]
reveal = [
  { run = 'open -R "$1"',          desc = "Reveal in Finder",   for = "macos" },
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
]
extract = [
  { run = '7zz x -y "$1" -o"$(dirname "$1")"', desc = "Extract here", for = "unix" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
]

[open]
prepend_rules = [
  { url = "*/",  use = ["edit", "open", "reveal"] },
  { mime = "text/*",                       use = ["edit", "reveal"] },
  { mime = "application/json",             use = ["edit", "reveal"] },
  { mime = "application/x-*shellscript",   use = ["edit", "reveal"] },
  { mime = "inode/x-empty",                use = ["edit", "reveal"] },
  { mime = "image/*",                      use = ["open", "reveal"] },
  { mime = "video/*",                      use = ["play", "open", "reveal"] },
  { mime = "audio/*",                      use = ["play", "open", "reveal"] },
  { mime = "application/zip",              use = ["extract", "reveal"] },
  { mime = "application/gzip",             use = ["extract", "reveal"] },
  { mime = "application/x-tar",            use = ["extract", "reveal"] },
  { mime = "application/x-bzip2",          use = ["extract", "reveal"] },
  { mime = "application/x-7z-compressed",  use = ["extract", "reveal"] },
  { mime = "application/x-rar",            use = ["extract", "reveal"] },
  { mime = "application/xz",               use = ["extract", "reveal"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912
image_bound      = [0, 0]
suppress_preload = false

[plugin]
prepend_fetchers = []
prepend_preloaders = []
prepend_previewers = []
